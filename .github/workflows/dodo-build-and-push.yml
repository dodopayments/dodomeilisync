name: Docker Publish

on:
  workflow_dispatch:

jobs:
  docker_build_and_push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t ${{MEILISYNC_GAR_LOCATION}}:latest .

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.SERVICE_ACCOUNT_KEY }}"

      - name: "Set up Cloud SDK"
        uses: "google-github-actions/setup-gcloud@v2"

      - name: "Use gcloud CLI"
        run: "gcloud info"

      - name: "Docker auth"
        run: |
          gcloud auth configure-docker ${{ vars.REGION }}-docker.pkg.dev

      - name: Push dodo-meilisync image to GAR
        run: docker push ${{ vars.MEILISYNC_GAR_LOCATION}}:latest
